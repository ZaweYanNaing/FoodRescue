services:

  # ──────────────────────────────────────────────
  # PHP / Laravel Application
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: food_rescue_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor          # keep vendor inside container
      - /var/www/html/node_modules    # keep node_modules inside container
    environment:
      - APP_ENV=local
    networks:
      - food_rescue_network
    depends_on:
      db:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Nginx Web Server
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: food_rescue_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - food_rescue_network
    depends_on:
      - app

  # ──────────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: food_rescue_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_rescue
      MYSQL_USER: food_user
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"   # 3307 on host to avoid conflicts with a local MySQL
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - food_rescue_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "food_user", "-psecretpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # phpMyAdmin
  # ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: food_rescue_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: food_user
      PMA_PASSWORD: secretpassword
    networks:
      - food_rescue_network
    depends_on:
      db:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Node.js (Vite dev server – optional, for HMR)
  # ──────────────────────────────────────────────
  node:
    image: node:22-alpine
    container_name: food_rescue_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - food_rescue_network
    profiles:
      - dev   # only starts with: docker compose --profile dev up

volumes:
  db_data:

networks:
  food_rescue_network:
    driver: bridge
